<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #041026;
      --bg2: #082048;
      --text: #d7edff;
      --accent: #74c8ff;
      --accent2: #91d8ff;
      --shadow: rgba(116, 200, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #0a2b5b 0%, #041026 45%, #020613 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .page {
      position: relative;
      width: min(100%, 100vw);
      min-height: 100vh;
      padding: 24px 16px 24px;
      border-radius: 0;
      background: radial-gradient(circle at top, rgba(37, 87, 170, 0.16), transparent 35%), linear-gradient(180deg, rgba(4, 18, 54, 0.98), rgba(2, 8, 28, 0.98));
      box-shadow: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stars,
    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(148, 230, 255, 0.9);
      filter: drop-shadow(0 0 10px rgba(116, 200, 255, 0.5));
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: grid;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .title {
      font-size: clamp(2.4rem, 4vw, 4.8rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 45px rgba(116, 200, 255, 0.35);
      color: #c3e6ff;
    }

    .subtitle {
      margin: 0;
      font-size: 1.15rem;
      color: #c3e8ff;
      opacity: 0.96;
      transition: opacity 0.6s ease;
    }

    .card {
      position: relative;
      display: grid;
      gap: 16px;
      padding: 0;
      min-height: auto;
      border-radius: 0;
      background: transparent;
      border: none;
      backdrop-filter: none;
      box-shadow: none;
    }

    .flower-frame {
      position: relative;
      font-family: "Courier New", Courier, monospace;
      line-height: 1.08;
      white-space: pre;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: #d7f0ff;
      min-height: min(88vh, 800px);
      width: 100%;
      text-align: center;
      padding: 12px 10px 8px;
      display: grid;
      align-items: center;
      justify-items: center;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px) scale(0.97);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .flower-frame.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .flower-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 20%, rgba(116, 200, 255, 0.14), transparent 38%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .flower-frame.visible::after {
      opacity: 1;
    }

    .caption {
      font-size: 0.94rem;
      color: #9dceff;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .caption.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .message, .wish {
      display: none;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      border-radius: 2px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 1; }
      30% { opacity: 1; }
      100% { transform: translate3d(var(--x,0px), 110vh, 0) rotate(720deg); opacity: 0.05; }
    }

    .footer {
      font-size: 0.95rem;
      color: rgba(180, 216, 255, 0.8);
      opacity: 0.95;
      margin-top: 10px;
    }

    @media (max-width: 620px) {
      .page { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="stars" aria-hidden="true"></div>
    <div class="confetti" aria-hidden="true"></div>

    <div class="content">
      <div>
        <h1 class="title">Happy Birthday!</h1>
        <p class="subtitle">Wishing you the best day ever with blooming joy and sparkling surprises.</p>
      </div>

      <section class="card">
        <div id="flower" class="flower-frame"></div>
        <div id="caption" class="caption">Watch your birthday wish bloom into a sparkling surprise.</div>
      </section>
      <p class="footer">Built with love, animated for a magical celebration.</p>
    </div>
  </div>

  <script>
        const frames = [
      `

         .
         |
        \\
         |
`,
      `

        ( )
         |
        /|\\
         |
`,
      `
       .-'-.
      (  o  )
       '-' 
         |
        /|\\
`,
      `
     .-"""-.
    (   ( )   )
     '-. .-'
        | 
         |
        /|\\
`,
      `
      .-~~-.
    .-'     '-.
   (   ( o )   )
    '-.   .-'
      '--'
         |
        /|\\
`,
      `
         .-.
       .-' '-.
      (  .-.  )
    .-' ( o ) '-.
   (    '---'    )
    '-.     .-'
       '---'
         |
        /|\\
`
    ];

    const finalArt = `
      HAPPY BIRTHDAY!

         .-''''-.
        /  HAPPY  \\
       / BIRTHDAY! \\
      /___________\\
         ||   ||
      .-''-''-.
     /        \\
    /  .----.  \\
   /__/      \__\\
   |  |      |  |
   |__|      |__|
`;

    const finalCaption = 'May your day be full of joy, laughter, and blue birthday magic!';
    const flowerDiv = document.getElementById('flower');
    const caption = document.getElementById('caption');
    let currentIndex = 0;

    const nextFrame = () => {
      if (currentIndex < frames.length) {
        flowerDiv.textContent = frames[currentIndex];
        flowerDiv.classList.add('visible');
        const delay = currentIndex === frames.length - 1 ? 850 : 650;
        setTimeout(() => {
          flowerDiv.classList.remove('visible');
          currentIndex += 1;
          setTimeout(nextFrame, 260);
        }, delay);
      } else {
        setTimeout(() => {
          flowerDiv.textContent = finalArt;
          flowerDiv.classList.add('visible');
          caption.textContent = finalCaption;
          caption.classList.add('visible');
        }, 480);
      }
    };

    const createStars = () => {
      const stars = document.querySelector('.stars');
      const count = 32;
      for (let i = 0; i < count; i += 1) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 2;
        Object.assign(star.style, {
          width: `${size}px`,
          height: `${size}px`,
          left: `${Math.random() * 100}%`,
          top: `${Math.random() * 100}%`,
          animationDelay: `${Math.random() * 2}s`,
          animationDuration: `${2.2 + Math.random() * 1.5}s`,
          opacity: `${0.45 + Math.random() * 0.5}`
        });
        stars.appendChild(star);
      }
    };

    const createConfetti = () => {
      const confettiArea = document.querySelector('.confetti');
      const colors = ['#74c8ff', '#91d8ff', '#2f7fff', '#48c3ff', '#8ff1ff'];
      const count = 42;
      for (let i = 0; i < count; i += 1) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const size = 8 + Math.random() * 8;
        const xOffset = Math.random() * 80 - 40;
        const left = Math.random() * 100;
        const delay = Math.random() * 1.2;
        const duration = 3 + Math.random() * 2.5;
        Object.assign(piece.style, {
          width: `${size}px`,
          height: `${size * 0.45}px`,
          left: `${left}%`,
          top: `${-Math.random() * 20}%`,
          background: colors[Math.floor(Math.random() * colors.length)],
          transform: `rotate(${Math.random() * 360}deg)`,
          animationDuration: `${duration}s`,
          animationDelay: `${delay}s`,
          '--x': `${xOffset}px`
        });
        confettiArea.appendChild(piece);
      }
    };

    createStars();
    createConfetti();
    nextFrame();
  </script>
</body>
</html>
